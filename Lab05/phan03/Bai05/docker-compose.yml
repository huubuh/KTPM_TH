version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - vote_net

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vote_net

  vote:
    image: dockersamples/examplevotingapp_vote
    ports:
      - "5000:80"
    depends_on:
      - redis
    networks:
      - vote_net

  result:
    image: dockersamples/examplevotingapp_result
    ports:
      - "5001:80"
    depends_on:
      - db
    networks:
      - vote_net

  worker:
    image: dockersamples/examplevotingapp_worker
    depends_on:
      - redis
      - db
    networks:
      - vote_net

volumes:
  db_data:

networks:
  vote_net: